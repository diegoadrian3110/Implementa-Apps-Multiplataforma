<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrarse</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="registro.css">
</head>
<body>
    <div class="login-container">
        <h2>Registrarse</h2>
        <div class="form-group">
                <form action="conexion.php" method="POST">
                    <label for="usuario">Nombre de usuario</label>
                    <input type="text" id="username" name="username" placeholder="Ingresa tu usuario" required>
                </div>
                <div class="form-group">
                    <label for="usuario">Correo electronico</label>
                    <input type="email" id="email" name="email" placeholder="Ingresa tu correo electronico" required>
                </div>
                <div class="form-group">
                    <label for="contrasena">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Ingresa una contraseña" required>
                </div>
                <button type="submit" class="login-btn">Registrarse</button></form>
        <div class="extra">
            Ya tienes una cuenta? <a href="sesion.html">Iniciar Sesión</a>
        </div>
    </div>
</body>
</html>
